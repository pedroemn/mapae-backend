spring.application.name=mapae-backend

# Credenciais so no ambiente ou no .env (AD-010). Sem elas, usa o banco local
# do compose.yaml (AD-020). Para o Supabase, veja o .env.example.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${MAPAE_DB_URL:jdbc:postgresql://localhost:5433/mapae}
spring.datasource.username=${MAPAE_DB_USUARIO:mapae}
spring.datasource.password=${MAPAE_DB_SENHA:mapae}

# Session Pooler do Supabase com poucas conexoes (AD-011)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# O PostGIS fica no schema extensions (AD-017)
spring.datasource.hikari.connection-init-sql=SET search_path TO public, extensions

# O Flyway e o dono do schema; o Hibernate so valida (AD-008)
# O historico fica fora do public, que e exposto pela API de dados do Supabase (AD-024)
spring.flyway.default-schema=flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.mvc.problemdetails.enabled=true
